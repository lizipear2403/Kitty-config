clear_all_shortcuts yes

font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font       Hack Nerd Font Mono Italic
bold_italic_font   Hack Nerd Font Mono Bold Italic

#italic_font       JetBrainsMono Nerd Italic
#bold_italic_font  JetBrainsMono Nerd Bold Italic
#font_family         JetBrainsMono Nerd Font
#bold_font           JetBrainsMono Nerd Font Bold
shell_integration enabled
allow_remote_control yes
background_image_linear yes

shell zsh
cursor_trail_decay 0.2 0.5
cursor_trail 20
cursor_shape block
adjust_column_width 0

hide_window_decoration titlebar-only 
window_padding_width 5
background_opacity 0.7
background_blur 30

cursor_trail_start_threshold 0
font_size        13
listen_on unix:/tmp/kitty

# 快捷键
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+k remote_control scroll-window 3l-
map ctrl+shift+j remote_control scroll-window 3l+
map ctrl+shift+n new_tab
map ctrl+shift+w close_tab
map ctrl+shift+t set_tab_title
map alt+z new_window
map alt+x close_window
map alt+; next_layout
map alt+' previous_layout
map ctrl+= change_font_size all +2.0
map ctrl+- change_font_size all -2.0

map alt+h    neighboring_window left
map alt+j    neighboring_window down
map alt+k    neighboring_window up
map alt+l    neighboring_window right
map ctrl+shift+r start_resizing_window
map alt+right    resize_window wider
map alt+left     resize_window narrower
map alt+up       resize_window taller
map alt+down     resize_window shorter
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

action_alias kitty_scrollback_nvim kitten /home/lizi/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py           
map ctrl+shift+o    kitty_scrollback_nvim 
window_border_width 2pt

tab_bar_edge top
tab_bar_style powerline
# BEGIN_KITTY_THEME
# Atom
include current-theme.conf
# END_KITTY_THEME
